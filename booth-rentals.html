<!DOCTYPE html>
<!--
    DO NOT DELETE — this file is a redirect, not a page.

    Until 2026-08-13 the booth-rental content lived at /booth-rentals.html. That
    content is now the home page, so this stub bounces the old URL to "/". It is
    the only redirect mechanism available: GitHub Pages serves static files and
    cannot issue a server-side 301.

    Both https://lvtradeshowrental.com/booth-rentals.html and .../booth-rentals
    are live and return 200 today. Deleting this file turns both into 404s for
    anyone arriving from an old link, bookmark, or search result.

    It costs 612 bytes, is never requested by any page on the site, and carries
    noindex + a canonical to "/", so it does not compete in search.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <meta http-equiv="refresh" content="0; url=/">
    <link rel="canonical" href="https://lvtradeshowrental.com/">
    <title>Custom Trade Show Booth Rentals Las Vegas | LV Trade Show Rentals</title>
    <script>window.location.replace('/');</script>
</head>
<body>
    <p>Our booth rentals now live on the home page.
       <a href="/">Continue to LV Trade Show Rentals &rarr;</a></p>
</body>
</html>
